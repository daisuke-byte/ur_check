# UR賃貸 空室ウォッチャーの設定
#
# 監視する団地と、通知する部屋の条件をここで管理します。

area_name: 新浦安・東京23区

# 団地ページのURLに使うパス（https://www.ur-net.go.jp/chintai/<area_path>/<shisya>_<danchi><shikibetu>.html）
area_path: kanto/chiba

# 通知する部屋の条件（null の項目は無効）
filters:
  max_total_rent: 200000   # 家賃＋共益費の上限（円）。必須
  min_area: null           # 最低面積（㎡）。例: 50
  min_layout: null         # 最低間取り。例: "1DK"（1K < 1DK < 1LDK < 2K < 2DK < 2LDK < ...）
  min_floor: null          # 最低階数。例: 3

# 取得時のふるまい
request:
  interval_seconds: 1.5    # リクエストの間に空ける秒数
  max_retries: 3           # 失敗したときのリトライ回数（指数バックオフ）
  timeout_seconds: 20

# 何回連続で取得に失敗したら Slack に ⚠️ を送るか
error_alert_after: 3

# 区・市ごとにまとめて監視するエリア
#   毎回、区ごとの団地一覧を取得し、空室がある団地だけ部屋の詳細を取りに行きます（団地を1つずつ書く必要なし）
#   tdfk: 都道府県コード（東京=13）、skcs: 市区町村コードの下3桁（千代田区=101 … 江戸川区=123）
#   エリアを追加した直後の回は、そのエリアの「現在の空室一覧」を1回だけ送り、以降は新着だけ通知します
search_areas:
  - name: 東京23区
    block: kanto
    tdfk: "13"
    skcs: ["101", "102", "103", "104", "105", "106", "107", "108", "109", "110", "111", "112",
           "113", "114", "115", "116", "117", "118", "119", "120", "121", "122", "123"]

# 個別に監視する団地（新浦安エリア）
#   id: <shisya>_<danchi>_<shikibetu>（団地ページURLの 30_5120.html → 30_512_0）
#   access: 通知に載せる最寄り駅と所要時間
danchi:
  - id: "30_312_0"
    name: 浦安ニューシティ美浜西エステート
    access:
      - JR京葉線「新浦安」駅 徒歩6～12分
  - id: "30_418_0"
    name: 浦安マリナイースト２１フォーラム海風の街
    access:
      - JR京葉線「新浦安」駅 徒歩12～14分 又はバス2分 徒歩1～3分
  - id: "30_513_0"
    name: 浦安マリナイースト２１潮音の街
    access:
      - JR京葉線「新浦安」駅 バス7分 徒歩5～7分
  - id: "30_512_0"
    name: 浦安マリナイースト２１望海の街
    access:
      - JR京葉線「新浦安」駅 徒歩22～26分 又はバス7～10分 徒歩1～4分
  - id: "30_583_0"
    name: 浦安マリナイースト２１海園の街
    access:
      - JR京葉線「新浦安」駅 徒歩25～29分 又はバス10分 徒歩2～4分
  - id: "30_584_0"
